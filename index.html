<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FitPlan</title>
  <!-- PWA / iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitPlan">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d0d14">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right); }
    :root {
      --bg: #0d0d14; --bg2: #16161f; --bg3: #1e1e2a; --bg4: #252535;
      --border: #2a2a3e; --text: #eaeaf5; --text2: #8888aa;
      --accent: #7c6ffc; --green: #3dd68c; --orange: #fc9a3d;
      --yellow: #fcd23d; --blue: #3da8fc; --red: #fc3d5a;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }

    /* HEADER */
    .header { background: linear-gradient(160deg,#0f0f1c,#191926); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; padding-top: var(--sat); }
    .header-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 10px; }
    .app-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg,var(--accent),#fc6f8a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .app-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .header-badge { font-size: 11px; font-weight: 600; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); padding: 5px 10px; border-radius: 20px; }
    .day-tabs { display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 8px; }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-tab { flex: 1; min-width: 80px; padding: 10px 6px 0; border: none; background: transparent; color: var(--text2); cursor: pointer; font-size: 14px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color 0.2s; }
    .day-tab .dn { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.5; }
    .day-tab .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; margin: 6px 0 4px; transition: background 0.2s; }
    .day-tab.active { color: var(--text); }
    .day-tab.active .dn { opacity: 0.8; }
    .day-tab.active .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

    /* CONTENT */
    .content { padding: 20px 16px calc(100px + var(--sab)); max-width: 680px; margin: 0 auto; padding-left: calc(16px + var(--sal)); padding-right: calc(16px + var(--sar)); }

    /* DAY HERO */
    .day-hero { background: linear-gradient(135deg,var(--bg2),var(--bg3)); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; position: relative; overflow: hidden; }
    .day-hero::before { content: ''; position: absolute; top: -30px; right: -30px; width: 120px; height: 120px; border-radius: 50%; background: var(--dc, var(--accent)); opacity: 0.07; }
    .day-hero-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dc, var(--accent)); margin-bottom: 4px; }
    .day-hero-name { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .day-hero-sub { font-size: 14px; color: var(--text2); margin-top: 4px; }
    .prog-wrap { margin-top: 16px; }
    .prog-nums { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
    .prog-nums .dc { color: var(--dc, var(--accent)); font-weight: 600; }
    .prog-track { height: 5px; background: var(--bg4); border-radius: 3px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 3px; transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1); }

    /* SECTION */
    .section { margin-bottom: 28px; }
    .sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .sec-name { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text2); }
    .sec-line { flex: 1; height: 1px; background: var(--border); }

    /* SUPERSET */
    .ss-group { margin-bottom: 12px; }
    .ss-badge { background: linear-gradient(90deg,rgba(124,111,252,.15),transparent); border-left: 3px solid var(--accent); padding: 5px 10px; font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1px; }
    .ss-conn { display: flex; align-items: center; justify-content: center; padding: 2px 0; }
    .ss-conn-line { width: 2px; height: 14px; background: var(--border); border-radius: 1px; }

    /* EXERCISE CARD */
    .ex-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 14px; transition: opacity 0.3s; margin-bottom: 10px; }
    .ex-card.in-ss { margin-bottom: 0; border-radius: 10px; }
    .ex-card.ss-top { border-radius: 14px 14px 10px 10px; }
    .ex-card.ss-bot { border-radius: 10px 10px 14px 14px; }
    .ex-card.done-card { opacity: 0.4; }
    .ex-row { display: flex; gap: 12px; align-items: flex-start; }

    /* THUMBNAIL */
    .ex-thumb { width: 68px; height: 68px; border-radius: 12px; overflow: hidden; flex-shrink: 0; background: var(--bg3); }
    .ex-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* CHECK */
    .ex-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); background: transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.25s; margin-top: 2px; }
    .ex-check:hover { border-color: var(--green); }
    .ex-check.checked { background: var(--green); border-color: var(--green); transform: scale(1.1); }
    .ex-check.checked::after { content:''; width: 9px; height: 6px; border-left: 2px solid #0a1a0f; border-bottom: 2px solid #0a1a0f; transform: rotate(-45deg) translateY(-1px); display: block; }

    .ex-body { flex: 1; min-width: 0; }
    .ex-name { font-size: 14px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
    .ex-stats { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .badge { display: flex; align-items: center; gap: 3px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; font-size: 11px; font-weight: 500; }
    .badge.s { color: var(--blue); } .badge.r { color: var(--text); }
    .badge.t { color: var(--yellow); } .badge.e { color: var(--orange); }
    .ex-tip { background: rgba(124,111,252,.06); border: 1px solid rgba(124,111,252,.15); border-radius: 9px; padding: 8px 10px; font-size: 12px; color: var(--text2); line-height: 1.5; margin-bottom: 8px; }
    .ex-tip::before { content: '💡 '; }
    .ex-actions { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
    .btn-vid { background: #cc0000; color: #fff; border: none; border-radius: 7px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all .15s; }
    .btn-vid:hover { background: #e60000; transform: translateY(-1px); }
    .btn-vid::before { content: '▶'; font-size: 10px; }
    .btn-rest-t { background: var(--bg3); color: var(--yellow); border: 1px solid var(--border); border-radius: 7px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
    .btn-rest-t::before { content: '⏱ '; }
    .btn-rest-t:hover { background: var(--yellow); color: #1a1000; border-color: var(--yellow); }
    .src-tag { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); padding: 2px 6px; border-radius: 5px; opacity: 0.6; }

    /* WEIGHT SECTION */
    .weight-section { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
    .weight-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .weight-last { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
    .weight-val { font-weight: 700; color: var(--green); font-size: 13px; }
    .weight-date { font-size: 11px; color: var(--text2); opacity: 0.6; }
    .btn-log { background: var(--bg3); color: var(--green); border: 1px solid rgba(61,214,140,.3); border-radius: 7px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .btn-log:hover { background: rgba(61,214,140,.12); }
    .btn-log.open { background: rgba(61,214,140,.12); border-color: var(--green); }
    .weight-form { display: none; margin-top: 10px; }
    .weight-form.open { display: block; }
    .weight-inputs { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .weight-inputs input { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-size: 13px; font-weight: 600; transition: border-color .15s; }
    .weight-inputs input:focus { outline: none; border-color: var(--green); }
    .input-kg { width: 80px; }
    .input-reps { width: 65px; }
    .input-note { flex: 1; min-width: 80px; font-weight: 400 !important; }
    .btn-save { background: var(--green); color: #071a0e; border: none; border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: filter .15s; }
    .btn-save:hover { filter: brightness(1.1); }
    .weight-hist { display: flex; gap: 6px; flex-wrap: wrap; }
    .hist-pill { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 11px; display: flex; flex-direction: column; gap: 1px; }
    .hist-pill-kg { font-weight: 700; color: var(--text); }
    .hist-pill-dt { color: var(--text2); font-size: 10px; opacity: 0.7; }

    /* INPUT placeholders */
    input::placeholder { color: var(--text2); opacity: 0.5; }
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* COMPLETE BANNER */
    .done-banner { display: none; text-align: center; background: linear-gradient(135deg,rgba(61,214,140,.1),rgba(61,214,140,.04)); border: 1px solid rgba(61,214,140,.25); border-radius: 14px; padding: 18px; margin-bottom: 20px; }
    .done-banner.show { display: block; }
    .done-banner h3 { font-size: 18px; font-weight: 800; color: var(--green); margin-bottom: 4px; }
    .done-banner p { font-size: 13px; color: var(--text2); }

    /* REST TIMER */
    .timer-overlay { display: none; position: fixed; inset: 0; background: rgba(5,5,12,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
    .timer-overlay.show { display: flex; }
    .timer-lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--text2); }
    .timer-ring-wrap { position: relative; width: 190px; height: 190px; }
    .timer-ring-svg { transform: rotate(-90deg); width: 190px; height: 190px; }
    .ring-bg { fill: none; stroke: var(--bg3); stroke-width: 6; }
    .ring-fg { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .timer-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .timer-secs { font-size: 68px; font-weight: 800; letter-spacing: -3px; line-height: 1; }
    .timer-unit { font-size: 12px; color: var(--text2); letter-spacing: 1px; font-weight: 600; }
    .timer-btns { display: flex; gap: 12px; }
    .btn-t { padding: 13px 30px; border-radius: 13px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; transition: all .2s; }
    .btn-t.skip { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
    .btn-t.skip:hover { background: var(--bg4); }
    .btn-t.done { background: var(--green); color: #071a0e; }
    .btn-t.done:hover { filter: brightness(1.1); }

    /* HISTORY */
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .history-btn { font-family: inherit; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .history-btn:hover { background: var(--bg4); }
    .history-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(124,111,252,.12); }
    .day-tab.dim { opacity: .35; }
    .view-nav { display: flex; gap: 8px; padding: 0 20px 8px; overflow-x: auto; scrollbar-width: none; }
    .view-nav::-webkit-scrollbar { display: none; }
    .view-nav .history-btn { flex: 1; padding: 7px 10px; font-size: 12px; }

    /* SHARED CARDS (PESO / COMIDA) */
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text2); margin-bottom: 12px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .stat { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .stat-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--text2); margin-bottom: 4px; }
    .stat-val { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .stat-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .coach { border-left: 3px solid var(--accent); background: linear-gradient(90deg,rgba(124,111,252,.12),var(--bg2) 60%); }
    .coach p { font-size: 13px; line-height: 1.55; }
    .coach p + p { margin-top: 8px; }
    .coach .coach-head { font-size: 14px; font-weight: 800; margin-bottom: 6px; }

    /* PESO */
    .bw-form { display: flex; gap: 8px; flex-wrap: wrap; }
    .bw-form input { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; color: var(--text); font-size: 14px; font-weight: 600; font-family: inherit; min-width: 0; }
    .bw-form input:focus { outline: none; border-color: var(--green); }
    .bw-form .in-kg { width: 90px; }
    .bw-form .in-date { width: 150px; color-scheme: dark; }
    .bw-form .in-note { flex: 1; min-width: 120px; font-weight: 400; }
    .bw-hint { font-size: 11px; color: var(--text2); margin-top: 8px; }
    .chart-wrap { position: relative; }
    .chart-wrap svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
    .chart-legend { display: flex; gap: 14px; font-size: 11px; color: var(--text2); margin-bottom: 8px; }
    .chart-legend span { display: flex; align-items: center; gap: 6px; }
    .lg-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text2); }
    .lg-line { width: 16px; height: 2px; border-radius: 2px; background: var(--accent); }
    .chart-tip { position: absolute; pointer-events: none; background: var(--bg4); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -110%); display: none; }
    .chart-tip b { color: var(--text); }
    .bw-list { display: flex; flex-direction: column; }
    .bw-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .bw-item:last-child { border-bottom: none; }
    .bw-item .bw-d { color: var(--text2); width: 92px; flex-shrink: 0; }
    .bw-item .bw-kg { font-weight: 700; }
    .bw-item .bw-n { color: var(--text2); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bw-del { background: transparent; border: none; color: var(--text2); font-size: 14px; cursor: pointer; padding: 2px 6px; margin-left: auto; }
    .bw-del:hover { color: var(--red); }
    .wk-row { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--border); }
    .wk-row:last-child { border-bottom: none; }
    .wk-row .wk-d { font-weight: 600; }
    .up { color: var(--green); } .down { color: var(--orange); } .flat { color: var(--text2); }

    /* COMIDA */
    .macro-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin: 12px 0 8px; }
    .macro-bar div { height: 100%; }
    .macro-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--text2); }
    .macro-legend span { display: flex; align-items: center; gap: 5px; }
    .macro-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
    .kcal-adj { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--text2); flex-wrap: wrap; }
    .kcal-adj button { background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 4px 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .meal { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
    .meal-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
    .meal-ico { font-size: 22px; }
    .meal-name { font-size: 15px; font-weight: 700; }
    .meal-when { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .meal-macros { margin-left: auto; text-align: right; font-size: 11px; color: var(--text2); white-space: nowrap; }
    .meal-macros b { display: block; font-size: 14px; color: var(--text); }
    .meal-body { padding: 0 16px 14px; display: none; }
    .meal.open .meal-body { display: block; }
    .meal-opt { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
    .meal-opt-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); margin-bottom: 5px; }
    .meal-opt ul { list-style: none; font-size: 13px; line-height: 1.6; }
    .meal-opt li::before { content: "• "; color: var(--text2); }
    .supp { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .supp:last-child { border-bottom: none; }
    .supp-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 3px 7px; border-radius: 6px; height: fit-content; white-space: nowrap; }
    .supp-tag.yes { color: var(--green); background: rgba(61,214,140,.12); }
    .supp-tag.rec { color: var(--blue); background: rgba(61,168,252,.12); }
    .supp-tag.opt { color: var(--yellow); background: rgba(252,210,61,.1); }
    .supp-tag.no { color: var(--text2); background: var(--bg3); }
    .supp-name { font-size: 13px; font-weight: 700; }
    .supp-txt { font-size: 12px; color: var(--text2); line-height: 1.5; margin-top: 2px; }
    .rules { list-style: none; display: flex; flex-direction: column; gap: 9px; font-size: 13px; line-height: 1.5; }
    .rules li { display: flex; gap: 10px; }
    .avoid { font-size: 12px; color: var(--text2); line-height: 1.5; }

    .hist-intro { margin-bottom: 20px; }
    .hist-intro h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .hist-intro p { font-size: 13px; color: var(--text2); line-height: 1.5; }
    .hist-empty { text-align: center; color: var(--text2); font-size: 14px; padding: 40px 20px; background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; }
    .hist-week { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .hist-week-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .hist-week-range { font-size: 15px; font-weight: 700; }
    .hist-week-pct { font-size: 12px; color: var(--green); font-weight: 600; }
    .hist-days { display: flex; gap: 8px; flex-wrap: wrap; }
    .hist-day-pill { flex: 1; min-width: 70px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 8px; text-align: center; }
    .hist-day-pill .hdp-name { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); margin-bottom: 3px; }
    .hist-day-pill .hdp-pct { display: block; font-size: 15px; font-weight: 800; color: var(--dc, var(--text)); }
    .hist-weights { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .hist-ex-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
    .hist-ex-name { color: var(--text2); }
    .hist-ex-vals { font-weight: 600; text-align: right; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="app-title">FitPlan</div>
      <div class="app-sub">David &amp; Muri · FGF Golf Fitness</div>
    </div>
    <div class="header-actions">
      <div class="header-badge" id="todayBadge">Hoy</div>
    </div>
  </div>
  <div class="view-nav">

// ─── WEEK HELPERS ───────────────────────────────────────────────────
function getWeekKey(d) {
  const dt = new Date(d);
  const wd = (dt.getDay() + 6) % 7; // Monday = 0
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate() - wd);
  const y = dt.getFullYear(), m = String(dt.getMonth()+1).padStart(2,'0'), day = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseLocalDate(weekKey) {
  const [y,m,d] = weekKey.split('-').map(Number);
  return new Date(y, m-1, d);
}
function getWeekEnd(weekKey) {
  const dt = parseLocalDate(weekKey);
  dt.setDate(dt.getDate() + 6);
  return dt;
}
function fmtWeekRange(weekKey) {
  const opts = { day:'2-digit', month:'short' };
  return `${parseLocalDate(weekKey).toLocaleDateString('es-ES',opts)} – ${getWeekEnd(weekKey).toLocaleDateString('es-ES',opts)}`;
}

// ─── STATE ──────────────────────────────────────────────────────────
let completed = {};       // { [weekKey]: { "dayIdx-exIdx": true } }
let weights   = {};       // { [exName]: [{kg,reps,note,date,week}] }
let currentWeekKey = getWeekKey(new Date());
let bodyLog   = [];       // [{date:'YYYY-MM-DD', kg, note}] sorted by date
let nutrition = { kcalOffset: 0 }; // manual calorie adjustment on top of the base target
let currentView = 'plan'; // 'plan' | 'history' | 'body' | 'food'

function isDone(key) { return !!(completed[currentWeekKey] && completed[currentWeekKey][key]); }

function migrateData() {
  // Formato antiguo: completed = { "dayIdx-exIdx": true, ... } sin agrupar por semana
  const keys = Object.keys(completed);
  const looksFlat = keys.length > 0 && keys.every(k => typeof completed[k] === 'boolean');
  if (looksFlat) completed = { [currentWeekKey]: completed };
  if (!completed[currentWeekKey]) completed[currentWeekKey] = {};
}

async function loadData() {
  try {
    const r = await fetch('/api/load');
    if (r.ok) {
      const d = await r.json();
      completed = d.fit_done    || {};
      weights   = d.fit_weights || {};
      // Older data.json files predate these keys: fall back to the local copy instead of wiping it
      bodyLog   = d.fit_body      || JSON.parse(localStorage.getItem('fit_body') || '[]');
      nutrition = { kcalOffset: 0, ...(d.fit_nutrition || JSON.parse(localStorage.getItem('fit_nutrition') || '{}')) };
      migrateData();
      return;
    }
  } catch(e) {}
  // fallback: localStorage
  completed = JSON.parse(localStorage.getItem('fit_done')    || '{}');
  weights   = JSON.parse(localStorage.getItem('fit_weights') || '{}');
  bodyLog   = JSON.parse(localStorage.getItem('fit_body')    || '[]');
  nutrition = { kcalOffset: 0, ...JSON.parse(localStorage.getItem('fit_nutrition') || '{}') };
  migrateData();
}

async function saveData() {
  localStorage.setItem('fit_done',      JSON.stringify(completed));
  localStorage.setItem('fit_weights',   JSON.stringify(weights));
  localStorage.setItem('fit_body',      JSON.stringify(bodyLog));
  localStorage.setItem('fit_nutrition', JSON.stringify(nutrition));
  try {
    await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fit_done: completed, fit_weights: weights, fit_body: bodyLog, fit_nutrition: nutrition })
    });
  } catch(e) {}
}
let activeDay = 0;
let timerInt = null, timerTotal = 0, timerLeft = 0;
const CIRCUM = 2 * Math.PI * 83; // 521.5

// ─── INIT ────────────────────────────────────────────────────────────
async function init() {
  await loadData();
  const tabs = document.getElementById('dayTabs');
  DAYS.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (i === 0 ? ' active' : '');
    btn.innerHTML = `<span class="dn">${d.label}</span>${d.name}<span class="dot"></span>`;
    btn.onclick = () => { activeDay = i; currentView = 'plan'; selectTab(i); render(); };
    tabs.appendChild(btn);
  });
  const mapDay = [null,0,1,null,2,3,null][new Date().getDay()];
  if (mapDay !== null) { activeDay = mapDay; selectTab(mapDay); }
  const dn = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  document.getElementById('todayBadge').textContent = dn[new Date().getDay()];
  render();
}

function selectTab(idx) {
  document.querySelectorAll('.day-tab').forEach((t,i) => t.classList.toggle('active', i===idx));
}

// ─── VIEW SWITCH ────────────────────────────────────────────────────
function render() {
  document.querySelectorAll('.view-nav .history-btn').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  document.querySelectorAll('.day-tab').forEach(t => t.classList.toggle('dim', currentView !== 'plan'));
  if (currentView === 'history') renderHistory();
  else if (currentView === 'body') renderBody();
  else if (currentView === 'food') renderFood();
  else renderDay();
}

// Tapping the active view button (or any day tab) returns to the training plan
function setView(view) {
  currentView = currentView === view ? 'plan' : view;
  render();
  window.scrollTo(0, 0);
}

// ─── HISTORY VIEW ───────────────────────────────────────────────────
function renderHistory() {
  const weekKeys = Object.keys(completed)
    .filter(k => k !== currentWeekKey && Object.values(completed[k] || {}).some(Boolean))
    .sort().reverse();

  let html = `
    <div class="hist-intro">
      <h2>Histórico de semanas</h2>
      <p>Cada semana se archiva aquí automáticamente en cuanto empieza la siguiente, hayas completado todo o no. La semana actual (${fmtWeekRange(currentWeekKey)}) sigue activa en las pestañas de días.</p>
    </div>`;

  if (weekKeys.length === 0) {
    html += `<div class="hist-empty">Todavía no hay semanas archivadas. Vuelve la semana que viene 💪</div>`;
    document.getElementById('content').innerHTML = html;
    return;
  }

  weekKeys.forEach(wk => {
    const wkCompleted = completed[wk] || {};
    let totalAll = 0, doneAll = 0;
    const dayPills = DAYS.map((day, di) => {
      const total = day.sections.reduce((n,s) => n + s.exercises.length, 0);
      const done = Object.keys(wkCompleted).filter(k => k.startsWith(`${di}-`) && wkCompleted[k]).length;
      totalAll += total; doneAll += done;
      const pct = total ? Math.round(done/total*100) : 0;
      return `<div class="hist-day-pill" style="--dc:${day.color}"><span class="hdp-name">${day.name.slice(0,3)}</span><span class="hdp-pct">${pct}%</span></div>`;
    }).join('');

    const weekWeights = [];
    Object.keys(weights).forEach(exName => {
      const entries = (weights[exName] || []).filter(e => e.week === wk);
      if (entries.length) weekWeights.push({ exName, entries });
    });

    const weightsHtml = weekWeights.length ? `
      <div class="hist-weights">
        ${weekWeights.map(w => `
          <div class="hist-ex-row">
            <span class="hist-ex-name">${w.exName}</span>
            <span class="hist-ex-vals">${w.entries.map(e => `${e.kg}kg×${e.reps}`).join(' · ')}</span>
          </div>`).join('')}
      </div>` : '';

    const pctAll = totalAll ? Math.round(doneAll/totalAll*100) : 0;

    html += `
      <div class="hist-week">
        <div class="hist-week-head">
          <span class="hist-week-range">${fmtWeekRange(wk)}</span>
          <span class="hist-week-pct">${pctAll}% completado</span>
        </div>
        <div class="hist-days">${dayPills}</div>
        ${weightsHtml}
      </div>`;
  });

  document.getElementById('content').innerHTML = html;
}

// ─── BODY WEIGHT VIEW ─────────────────────────────────────────────────
// Lean-bulk pacing: aim for +0.1…+0.5 kg/week on the weekly average (daily weigh-ins are noisy)
const BULK_MIN = 0.1, BULK_MAX = 0.5;
const DAY_MS = 86400000;
let bwPts = []; // chart points for the hover tooltip
const BW_W = 360, BW_H = 200; // chart viewBox sized for phone width so labels stay legible

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDay(iso) {
  return parseLocalDate(iso).toLocaleDateString('es-ES', { day:'2-digit', month:'short' });
}
function fmtKg(v, sign) {
  const s = v.toFixed(1).replace('.', ',');
  return sign && v > 0 ? '+' + s : s;
}
function trendCls(v) { return v > 0.05 ? 'up' : v < -0.05 ? 'down' : 'flat'; }

function weeklyAverages() {
  const byWeek = {};
  bodyLog.forEach(e => {
    const wk = getWeekKey(parseLocalDate(e.date));
    (byWeek[wk] = byWeek[wk] || []).push(e.kg);
  });
  const weeks = Object.keys(byWeek).sort().map(wk => ({
    week: wk, n: byWeek[wk].length,
    avg: byWeek[wk].reduce((a,b) => a+b, 0) / byWeek[wk].length
  }));
  // kg/week vs the previous week with data (normalised when weeks are skipped)
  weeks.forEach((w, i) => {
    if (i === 0) { w.rate = null; return; }
    const gapWeeks = Math.round((parseLocalDate(w.week) - parseLocalDate(weeks[i-1].week)) / (7*DAY_MS)) || 1;
    w.rate = (w.avg - weeks[i-1].avg) / gapWeeks;
  });
  return weeks;
}

function bulkAdvice(weeks) {
  const off = nutrition.kcalOffset;
  const offTxt = off ? ` Ajuste actual: <b>${off > 0 ? '+' : ''}${off} kcal</b> sobre la base.` : '';
  const applied = nutrition.lastAdjustWeek === currentWeekKey;
  const lastWk = weeks[weeks.length-1];
  // One or two weigh-ins are too noisy to act on: only offer the adjustment once the week has 3+
  const partialWeek = !!lastWk && lastWk.week === currentWeekKey && lastWk.n < 3;
  const btn = (delta) => partialWeek
    ? `<p class="avoid">Cuando tengas 3 pesajes esta semana podrás aplicar el ajuste.</p>`
    : applied
    ? `<p class="avoid">Ya aplicaste un ajuste esta semana. Espera a ver la media de la próxima antes de volver a tocar.</p>`
    : `<p><button class="btn-save" onclick="applyKcal(${delta})">Aplicar ${delta > 0 ? '+' : ''}${delta} kcal a mi plan</button></p>`;

  if (weeks.length === 0) return {
    head: 'Empecemos por medir 📏',
    body: `<p>Pésate <b>3-4 mañanas por semana</b>, en ayunas, después de ir al baño y con la misma ropa. Yo me fijo en la <b>media semanal</b>, no en el dato de un día: el peso diario baila ±1 kg por agua y sal.</p>`
  };
  if (weeks.length === 1) return {
    head: 'Primera semana en marcha',
    body: `<p>Llevas ${weeks[0].n} registro${weeks[0].n > 1 ? 's' : ''}. Necesito al menos <b>2 semanas</b> de medias para decirte si ajustamos calorías. Sigue con el plan de 🍽️ Comida tal cual.${offTxt}</p>`
  };

  const last = weeks[weeks.length-1], prev = weeks[weeks.length-2];
  const partial = last.week === currentWeekKey && last.n < 3
    ? `<p class="avoid">Ojo: la semana actual solo tiene ${last.n} registro${last.n > 1 ? 's' : ''}, el dato es provisional.</p>` : '';
  const r = last.rate;
  const rateTxt = `Tu media pasó de <b>${fmtKg(prev.avg)}</b> a <b>${fmtKg(last.avg)} kg</b> (${fmtKg(r, true)} kg/semana).`;

  if (r < -0.1) return {
    head: 'Estás perdiendo peso 📉',
    body: `<p>${rateTxt} Para ganar músculo necesitas superávit: estás comiendo por debajo de lo que gastas. Revisa que haces las 5 comidas y sube <b>+200 kcal</b> (≈ 50 g de arroz crudo o 1 plátano + 30 g de avena).${offTxt}</p>${partial}${btn(200)}`
  };
  if (r < BULK_MIN) {
    const stalled = prev.rate !== null && prev.rate < BULK_MIN;
    return stalled ? {
      head: 'Estancado 2 semanas → subimos',
      body: `<p>${rateTxt} Dos semanas seguidas por debajo de +${fmtKg(BULK_MIN)} kg: toca subir <b>+150 kcal</b>, casi todo en carbohidrato (≈ 40 g de arroz crudo o una tostada más).${offTxt}</p>${partial}${btn(150)}`
    } : {
      head: 'Por debajo del ritmo, vigilamos',
      body: `<p>${rateTxt} Una semana floja puede ser agua o sal. Si la próxima semana tampoco sube de +${fmtKg(BULK_MIN)} kg, subiremos 150 kcal.${offTxt}</p>${partial}`
    };
  }
  if (r > BULK_MAX) return {
    head: 'Subiendo demasiado rápido',
    body: `<p>${rateTxt} Por encima de +${fmtKg(BULK_MAX)} kg/semana gran parte es grasa. Bajamos <b>−150 kcal</b> (≈ 35 g menos de arroz crudo o sin la miel/frutos secos de media mañana).${offTxt}</p>${partial}${btn(-150)}`
  };
  return {
    head: 'En el rango ideal ✅',
    body: `<p>${rateTxt} Entre +${fmtKg(BULK_MIN)} y +${fmtKg(BULK_MAX)} kg/semana es un volumen limpio: ganas músculo sin acumular grasa de más. No toques nada.${offTxt}</p>${partial}`
  };
}

function renderBodyChart(weeks) {
  if (bodyLog.length < 2) return `<p class="avoid">Con 2 registros o más aparecerá aquí la gráfica de evolución.</p>`;
  const W = BW_W, H = BW_H, pl = 34, pr = 10, pt = 12, pb = 24;
  const t0 = parseLocalDate(bodyLog[0].date).getTime();
  const t1 = Math.max(parseLocalDate(bodyLog[bodyLog.length-1].date).getTime(), t0 + DAY_MS);
  const kgs = bodyLog.map(e => e.kg);
  const lo = Math.floor(Math.min(...kgs) - 0.5), hi = Math.ceil(Math.max(...kgs) + 0.5);
  const step = hi - lo <= 3 ? 0.5 : hi - lo <= 8 ? 1 : 2;
  const x = t => pl + (t - t0) / (t1 - t0) * (W - pl - pr);
  const y = kg => pt + (hi - kg) / (hi - lo) * (H - pt - pb);

  let grid = '';
  for (let v = lo; v <= hi + 1e-9; v += step) {
    grid += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>
             <text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--text2)">${fmtKg(v)}</text>`;
  }

  // Weekly average plotted at mid-week (Thursday), clamped to the data range
  const wkPts = weeks.map(w => {
    const t = Math.min(Math.max(parseLocalDate(w.week).getTime() + 3*DAY_MS, t0), t1);
    return { x: x(t), y: y(w.avg) };
  });
  const avgLine = wkPts.length > 1
    ? `<polyline points="${wkPts.map(p => `${p.x},${p.y}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  const avgDots = wkPts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--accent)" stroke="var(--bg2)" stroke-width="2"/>`).join('');

  bwPts = bodyLog.map(e => ({ x: x(parseLocalDate(e.date).getTime()), y: y(e.kg), e }));
  const dots = bwPts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--text2)" stroke="var(--bg2)" stroke-width="2"/>`).join('');

  const xLbls = `<text x="${pl}" y="${H-6}" font-size="11" fill="var(--text2)">${fmtDay(bodyLog[0].date)}</text>
                 <text x="${W-pr}" y="${H-6}" font-size="11" fill="var(--text2)" text-anchor="end">${fmtDay(bodyLog[bodyLog.length-1].date)}</text>`;

  return `
    <div class="chart-legend"><span><i class="lg-dot"></i>Pesaje diario</span><span><i class="lg-line"></i>Media semanal</span></div>
    <div class="chart-wrap" id="bwChart">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso corporal">
        ${grid}${xLbls}
        <line id="bwCross" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--text2)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
        ${dots}${avgLine}${avgDots}
        <rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent"/>
      </svg>
      <div class="chart-tip" id="bwTip"></div>
    </div>`;
}

function bindBodyChart() {
  const wrap = document.getElementById('bwChart');
  if (!wrap) return;
  const svg = wrap.querySelector('svg'), tip = document.getElementById('bwTip'), cross = document.getElementById('bwCross');
  const show = ev => {
    const box = svg.getBoundingClientRect(), scale = box.width / BW_W;
    const vx = (ev.clientX - box.left) / scale;
    const p = bwPts.reduce((a, b) => Math.abs(b.x - vx) < Math.abs(a.x - vx) ? b : a);
    cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x); cross.setAttribute('visibility', 'visible');
    tip.innerHTML = `<b>${fmtKg(p.e.kg)} kg</b> · ${fmtDay(p.e.date)}${p.e.note ? ' · ' + escapeHtml(p.e.note) : ''}`;
    tip.style.left = Math.min(Math.max(p.x * scale, 70), box.width - 70) + 'px';
    tip.style.top = p.y * scale + 'px';
    tip.style.display = 'block';
  };
  const hide = () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', hide);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function renderBody() {
  const weeks = weeklyAverages();
  const last = bodyLog[bodyLog.length-1];
  const first = bodyLog[0];
  const thisWeek = weeks.find(w => w.week === currentWeekKey);
  const lastWeek = weeks[weeks.length-1];
  const advice = bulkAdvice(weeks);

  const stats = last ? `
    <div class="card">
      <div class="stat-grid">
        <div class="stat"><div class="stat-lbl">Último</div><div class="stat-val">${fmtKg(last.kg)} kg</div><div class="stat-sub">${fmtDay(last.date)}</div></div>
        <div class="stat"><div class="stat-lbl">Media esta semana</div><div class="stat-val">${thisWeek ? fmtKg(thisWeek.avg) + ' kg' : '—'}</div><div class="stat-sub">${thisWeek ? thisWeek.n + ' pesaje' + (thisWeek.n > 1 ? 's' : '') : 'sin registros'}</div></div>
        <div class="stat"><div class="stat-lbl">Ritmo semanal</div><div class="stat-val ${lastWeek && lastWeek.rate !== null ? trendCls(lastWeek.rate) : ''}">${lastWeek && lastWeek.rate !== null ? fmtKg(lastWeek.rate, true) + ' kg' : '—'}</div><div class="stat-sub">objetivo +${fmtKg(BULK_MIN)} a +${fmtKg(BULK_MAX)}</div></div>
        <div class="stat"><div class="stat-lbl">Desde el inicio</div><div class="stat-val ${trendCls(last.kg - first.kg)}">${fmtKg(last.kg - first.kg, true)} kg</div><div class="stat-sub">desde ${fmtDay(first.date)}</div></div>
      </div>
    </div>` : '';

  const weekRows = weeks.slice(-6).reverse().map(w => `
    <div class="wk-row">
      <span class="wk-d">${fmtWeekRange(w.week)}</span>
      <span>${fmtKg(w.avg)} kg <span class="${w.rate === null ? 'flat' : trendCls(w.rate)}">${w.rate === null ? '' : '(' + fmtKg(w.rate, true) + ')'}</span></span>
    </div>`).join('');

  const entries = bodyLog.slice(-10).reverse().map(e => `
    <div class="bw-item">
      <span class="bw-d">${fmtDay(e.date)}</span>
      <span class="bw-kg">${fmtKg(e.kg)} kg</span>
      <span class="bw-n">${e.note ? escapeHtml(e.note) : ''}</span>
      <button class="bw-del" onclick="deleteBody('${e.date}')" aria-label="Borrar">✕</button>
    </div>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="hist-intro">
      <h2>Peso corporal</h2>
      <p>Objetivo: volumen limpio. Me importa la tendencia de la media semanal, no el número de un día.</p>
    </div>
    <div class="card">
      <div class="card-title">Registrar pesaje</div>
      <div class="bw-form">
        <input class="in-kg" type="number" step="0.1" min="30" max="200" id="bwKg" placeholder="${last ? fmtKg(last.kg).replace(',', '.') : '68.0'}" inputmode="decimal">
        <input class="in-date" type="date" id="bwDate" value="${dateKey(new Date())}" max="${dateKey(new Date())}">
        <input class="in-note" type="text" id="bwNote" placeholder="nota (opcional)">
        <button class="btn-save" onclick="saveBody()">Guardar ✓</button>
      </div>
      <div class="bw-hint">En ayunas, después del baño. Si ya hay un pesaje ese día, se reemplaza.</div>
    </div>
    <div class="card coach">
      <div class="coach-head">🧑‍🏫 ${advice.head}</div>
      ${advice.body}
    </div>
    ${stats}
    ${bodyLog.length ? `<div class="card"><div class="card-title">Evolución</div>${renderBodyChart(weeks)}</div>` : ''}
    ${weeks.length ? `<div class="card"><div class="card-title">Medias semanales</div>${weekRows}</div>` : ''}
    ${bodyLog.length ? `<div class="card"><div class="card-title">Últimos pesajes</div><div class="bw-list">${entries}</div></div>` : ''}
  `;
  bindBodyChart();
}

function saveBody() {
  const kgEl = document.getElementById('bwKg');
  const kg = parseFloat(kgEl.value);
  const date = document.getElementById('bwDate').value || dateKey(new Date());
  if (!kg || kg < 30 || kg > 200) { kgEl.focus(); return; }
  const note = document.getElementById('bwNote').value.trim();
  bodyLog = bodyLog.filter(e => e.date !== date);
  bodyLog.push({ date, kg: Math.round(kg * 10) / 10, note });
  bodyLog.sort((a, b) => a.date.localeCompare(b.date));
  saveData();
  render();
}

function deleteBody(date) {
  if (!confirm(`¿Borrar el pesaje del ${fmtDay(date)}?`)) return;
  bodyLog = bodyLog.filter(e => e.date !== date);
  saveData();
  render();
}

function applyKcal(delta) {
  nutrition.kcalOffset += delta;
  nutrition.lastAdjustWeek = currentWeekKey;
  saveData();
  render();
}

function nutritionTargets() {
  const weeks = weeklyAverages();
  const refKg = weeks.length ? weeks[weeks.length-1].avg : (bodyLog.length ? bodyLog[bodyLog.length-1].kg : 68);
  const base = Math.round(refKg * KCAL_PER_KG / 50) * 50;
  const kcal = base + nutrition.kcalOffset;
  const p = Math.round(refKg * PROT_PER_KG), f = Math.round(refKg * FAT_PER_KG);
  const c = Math.max(0, Math.round((kcal - p*4 - f*9) / 4));
  return { refKg, base, kcal, p, f, c };
}

// ─── RENDER ───────────────────────────────────────────────────────────
function renderDay() {
  const day = DAYS[activeDay];
  let gi = 0;
  const secs = day.sections.map(s => {
    const exs = s.exercises.map(ex => ({ ex, gIdx: gi++ }));
    return { ...s, exs };
  });
  const total = gi;
  const doneCount = secs.flatMap(s=>s.exs).filter(({gIdx})=>isDone(`${activeDay}-${gIdx}`)).length;
  const pct = total ? Math.round(doneCount/total*100) : 0;
  const allDone = doneCount===total && total>0;

  let html = `
    <div class="day-hero" style="--dc:${day.color}">
      <div class="day-hero-lbl">${day.label} · ${allDone ? '¡Completado! 🎉' : pct+'% completado'}</div>
      <div class="day-hero-name">${day.name}</div>
      <div class="day-hero-sub">${day.sub}</div>
      <div class="prog-wrap">
        <div class="prog-nums"><span><span class="dc">${doneCount}</span> / ${total} ejercicios</span><span>${pct}%</span></div>
        <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${day.color}"></div></div>
      </div>
    </div>
    ${allDone ? `<div class="done-banner show"><h3>¡Entreno completado! 💪</h3><p>Buen trabajo. Recuerda hidratarte y estirar.</p></div>` : ''}
  `;

  secs.forEach(sec => {
    html += `<div class="section"><div class="sec-head"><span>${sec.icon}</span><span class="sec-name">${sec.name}</span><div class="sec-line"></div></div>`;
    let i = 0;
    while (i < sec.exs.length) {
      const { ex, gIdx } = sec.exs[i];
      const done = isDone(`${activeDay}-${gIdx}`);
      if (ex.ss && i+1 < sec.exs.length && sec.exs[i+1].ex.ss === ex.ss) {
        const { ex: ex2, gIdx: g2 } = sec.exs[i+1];
        const done2 = isDone(`${activeDay}-${g2}`);
        html += `<div class="ss-group"><div class="ss-badge">⚡ Superset ${ex.ss} — Sin descanso entre ejercicios</div>${renderCard(ex,gIdx,done,'ss-top')}${renderCard(ex2,g2,done2,'ss-bot')}</div>`;
        i += 2;
      } else {
        html += renderCard(ex, gIdx, done, '');
        i++;
      }
    }
    html += `</div>`;
  });

  document.getElementById('content').innerHTML = html;
}

function renderCard(ex, gIdx, done, extraCls) {
  const key = `${activeDay}-${gIdx}`;
  const cls = ['ex-card', extraCls, done ? 'done-card' : ''].filter(Boolean).join(' ');
  const restBtn = ex.rest ? `<button class="btn-rest-t" onclick="startTimer(${parseRest(ex.rest)})"> ${ex.rest}</button>` : '';
  const thumb = T[ex.thumb] || T.pushups;
  const wSection = renderWeightSection(ex.name, key, ex.reps);
  return `
    <div class="${cls}" id="card-${key}">
      <div class="ex-row">
        <div class="ex-thumb"><img src="${thumb}" alt=""></div>
        <div class="ex-check${done?' checked':''}" onclick="toggleDone('${key}')"></div>
        <div class="ex-body">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-stats">
            <span class="badge s">🔢 ${ex.sets} series</span>
            <span class="badge r">✕ ${ex.reps}</span>
            ${ex.rest ? `<span class="badge t">⏱ ${ex.rest}</span>` : ''}
            <span class="badge e">🎽 ${ex.equip}</span>
          </div>
          ${ex.tip ? `<div class="ex-tip">${ex.tip}</div>` : ''}
          <div class="ex-actions">
            <button class="btn-vid" onclick="openVideo('${ex.vid.replace(/'/g,"\\'")}')"> Ver video</button>
            ${restBtn}
            <span class="src-tag">${ex.src}</span>
          </div>
        </div>
      </div>
      ${wSection}
    </div>`;
}

    `<div class="hist-pill"><span class="hist-pill-kg">${e.kg} kg</span><span class="hist-pill-dt">${e.reps} reps · ${e.date}</span></div>`
  ).join('');

  const numReps = defaultReps.replace(/[^0-9]/,'') || '15';
  const safeKey = key.replace(/-/g,'_');
  const safeEx = exName.replace(/'/g,"\\'");

  return `
    <div class="weight-section">
      <div class="weight-row">
        <div class="weight-last">${lastStr}</div>
        <button class="btn-log" id="btnlog-${safeKey}" onclick="toggleWeight('${safeKey}')">+ Registrar</button>
      </div>
      <div class="weight-form" id="wform-${safeKey}">
        <div class="weight-inputs">
          <input class="input-kg" type="number" step="0.5" min="0" id="wkg-${safeKey}" placeholder="kg">
          <input class="input-reps" type="number" min="1" id="wreps-${safeKey}" value="${numReps}" placeholder="reps">
          <input class="input-note" type="text" id="wnote-${safeKey}" placeholder="nota (opcional)">
          <button class="btn-save" onclick="saveWeight('${safeEx}','${safeKey}')">Guardar ✓</button>
        </div>
        ${hist.length > 0 ? `<div class="weight-hist">${histHTML}</div>` : ''}
      </div>
    </div>`;
}

function toggleWeight(safeKey) {
  const form = document.getElementById(`wform-${safeKey}`);
  const btn  = document.getElementById(`btnlog-${safeKey}`);
  const open = form.classList.toggle('open');
  btn.classList.toggle('open', open);
  if (open) document.getElementById(`wkg-${safeKey}`).focus();
}

function saveWeight(exName, safeKey) {
  const kg    = parseFloat(document.getElementById(`wkg-${safeKey}`).value);
  const reps  = parseInt(document.getElementById(`wreps-${safeKey}`).value) || 0;
  const note  = document.getElementById(`wnote-${safeKey}`).value.trim();
  if (!kg || kg <= 0) { document.getElementById(`wkg-${safeKey}`).focus(); return; }
  if (!weights[exName]) weights[exName] = [];
  const today = new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
  weights[exName].push({ kg, reps, note, date: today, week: currentWeekKey });
  saveData();
  render();
}

// ─── INTERACTIONS ─────────────────────────────────────────────────────
function toggleDone(key) {
  completed[currentWeekKey][key] = !completed[currentWeekKey][key];
  saveData();
  render();
}

function openVideo(query) {
  window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(query), '_blank');
}

function parseRest(str) {
  if (!str) return 0;
  if (str.includes('m')) {
    const p = str.replace('m',':').replace('s','').split(':');
    return parseInt(p[0])*60 + (parseInt(p[1])||0);
  }
  return parseInt(str);
}

function startTimer(secs) {
  if (!secs || secs<=0) return;
  timerTotal = secs; timerLeft = secs;
  updateTimer();
  document.getElementById('timerOverlay').classList.add('show');
  if (timerInt) clearInterval(timerInt);
  timerInt = setInterval(() => {
    timerLeft--;
    updateTimer();
    if (timerLeft <= 0) {
      clearInterval(timerInt); timerInt = null;
      document.getElementById('timerSecs').textContent = '✓';
      document.getElementById('timerRing').style.strokeDashoffset = CIRCUM;
      if (navigator.vibrate) navigator.vibrate([150,80,150]);
      setTimeout(() => document.getElementById('timerOverlay').classList.remove('show'), 1200);
    }
  }, 1000);
}

function updateTimer() {
  document.getElementById('timerSecs').textContent = timerLeft;
  const offset = CIRCUM * (1 - timerLeft/timerTotal);
  document.getElementById('timerRing').style.strokeDashoffset = offset;
}

function stopTimer() {
  if (timerInt) { clearInterval(timerInt); timerInt = null; }
  document.getElementById('timerOverlay').classList.remove('show');
}

init();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
</script>
</body>
